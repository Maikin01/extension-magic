<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Infinity</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app">
        <!-- ========== TOP BAR ========== -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">R</div>
                <div class="brand-text">
                    <div class="brand-name">Rise</div>
                    <div class="brand-name-alt">Infinity</div>
                </div>
                <span class="badge-pro">PRO</span>
            </div>
            <div class="topbar-right">
                <div class="lang-switch">
                    <button class="lang active" data-lang="PT">PT</button>
                    <button class="lang" data-lang="EN">EN</button>
                    <button class="lang" data-lang="ES">ES</button>
                </div>
                <button class="icon-btn" title="Notificações">🔔</button>
                <button class="icon-btn" id="themeToggle" title="Alternar tema">🌙</button>
                <button class="icon-btn" id="licenseLogout" title="Sair da licença">⎋</button>
            </div>
        </header>

        <!-- ========== LICENSE GATE ========== -->
        <div class="license-gate" id="licenseGate">
            <div class="license-card">
                <div class="license-crown">👑</div>
                <h2>Insira sua licença</h2>
                <p class="license-sub">Insira sua licença</p>

                <form id="licenseForm" class="license-form" autocomplete="off">
                    <input
                        id="licenseKeyInput"
                        type="text"
                        placeholder="RISE-XXXX-XXXX-XXXX"
                        spellcheck="false"
                        autocapitalize="characters"
                        maxlength="64"
                    />
                    <button type="submit" id="licenseSubmit" class="btn-primary btn-block">
                        Validar Licença
                    </button>
                </form>

                <a href="https://vamos-extend-buddy.lovable.app/planos" target="_blank" rel="noopener" class="btn-buy">
                    🛒 Comprar Licença
                </a>

                <div id="licenseError" class="license-error" style="display:none;"></div>
                <div id="licenseStatus" class="license-status"></div>
            </div>
        </div>

        <!-- ========== CHAT SHELL ========== -->
        <div class="chat-shell" id="chatShell" style="display:none;">

            <!-- License info card -->
            <div class="license-info-bar" id="licenseInfoBar" style="display:none;">
                <div class="lic-row">
                    <div class="lic-user">
                        <span class="lic-name">User</span>
                        <span class="lic-status">ATIVO</span>
                    </div>
                </div>
                <div class="lic-sync">
                    <span class="dot-green"></span>
                    <span id="projectId">Carregando...</span>
                </div>
                <div class="lic-expiry">
                    <div class="lic-expiry-head">
                        <span>⏱ Licença expira em</span>
                        <span id="licenseInfoText" class="lic-timer">—</span>
                    </div>
                    <div class="lic-bar"><div class="lic-bar-fill"></div></div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="prompt">Prompt</button>
                <button class="tab" data-tab="history">Histórico</button>
            </div>

            <!-- ===== PROMPT TAB ===== -->
            <div class="tab-panel" id="tab-prompt">

                <!-- chat container (necessário para popup.js, oculto visualmente aqui pois usamos histórico) -->
                <div class="chat-container" id="chatContainer" hidden>
                    <div class="messages" id="messages"></div>
                </div>

                <div class="file-preview" id="filePreview" style="display:none;"></div>

                <div class="composer">
                    <textarea id="messageInput" rows="3" placeholder="Digite seu comando..."></textarea>

                    <div class="composer-row">
                        <label class="toggle">
                            <input type="checkbox" id="planModeToggle">
                            <span class="toggle-track"><span class="toggle-thumb"></span></span>
                            <span class="toggle-label">MODO PLANO</span>
                        </label>

                        <div class="composer-actions">
                            <button id="attachButton" class="ghost-btn" title="Anexar arquivo">📎</button>
                            <input type="file" id="fileInput" multiple
                                accept="image/*,.pdf,.doc,.docx,.txt,.js,.ts,.jsx,.tsx,.json,.css,.html"
                                style="display:none;" />
                            <button class="ghost-btn" id="settingsBtn" title="Configurações">⚙️</button>
                            <button class="ghost-btn" id="micBtn" title="Áudio (em breve)">🎤</button>
                            <button id="sendButton" class="btn-send">Enviar</button>
                        </div>
                    </div>
                </div>

                <div class="shortcuts">
                    <div class="shortcuts-title">ATALHOS RÁPIDOS</div>
                    <div class="shortcuts-grid">
                        <button class="shortcut" data-prompt="Analise o código e identifique todos os bugs, erros de lógica e problemas de segurança. Liste cada problema com sua localização e proponha a correção.">🔧 Bugs</button>
                        <button class="shortcut" data-prompt="Elabore um plano completo de refatoração e otimização do sistema em etapas.">📝 Refatorar</button>
                        <button class="shortcut" data-prompt="Verifique o console e a aplicação em busca de erros em tempo de execução. Explique a causa raiz de cada um e corrija.">🛡 Erros</button>
                        <button class="shortcut" data-prompt="Otimize o desempenho do projeto: reduza re-renders, melhore consultas ao banco, aplique code splitting e lazy loading onde fizer sentido.">⚡ Otimizar</button>
                        <button class="shortcut" data-prompt="Adicione comentários claros e objetivos em todo o código, explicando o que cada função e bloco faz.">💬 Comentários</button>
                        <button class="shortcut" data-prompt="Faça uma análise SEO completa da aplicação: meta tags, títulos, descrições, headings, structured data, performance e acessibilidade. Aplique as melhorias.">📈 SEO</button>
                        <button class="shortcut" data-prompt="Melhore o design da interface deixando-a mais moderna, responsiva e agradável, respeitando o sistema de design atual.">🎨 UI</button>
                        <button class="shortcut" data-prompt="Refatore os componentes deixando-os menores, reutilizáveis e bem tipados. Separe lógica de apresentação.">🧩 Componentes</button>
                        <button class="shortcut" data-prompt="Faça uma revisão completa de código apontando pontos fortes, problemas, riscos e melhorias sugeridas.">🔍 Review</button>
                    </div>

                    <button class="row-btn row-danger" data-prompt="Remova completamente o badge/marca d'água 'Made with Lovable' do projeto usando CSS com display:none e visibility:hidden, cobrindo todos os seletores possíveis (id, class, iframe e links para lovable.dev).">Remover Marca de Água</button>
                    <button class="row-btn row-danger" data-prompt="Ative o modo escudo de segurança: implemente RLS em todas as tabelas, valide entradas com Zod, adicione rate limit nas rotas públicas e revise permissões.">Ativar Escudo</button>
                    <button class="row-btn row-danger" data-prompt="Volte a usar o chat padrão do projeto (comportamento original), sem prompts customizados.">Usar Chat Padrão</button>
                    <button class="row-btn row-primary" id="downloadBtn">Baixar Código Fonte</button>
                    <button class="row-btn row-warning" id="newProjectBtn">Criar novo Projeto</button>
                </div>

                <div class="status-bar" id="statusBar"></div>
            </div>

            <!-- ===== HISTORY TAB ===== -->
            <div class="tab-panel" id="tab-history" hidden>
                <div class="history-head">
                    <span>Prompts enviados</span>
                    <button id="clearHistoryBtn" class="ghost-btn small" title="Limpar histórico">🗑</button>
                </div>
                <div class="history-empty" id="historyEmpty">
                    <div class="history-emoji">💬</div>
                    <div class="history-title">Nenhuma mensagem</div>
                    <div class="history-sub">Seus prompts enviados aparecerão aqui.</div>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>

            <footer class="footbar">
                <a href="https://vamos-extend-buddy.lovable.app/" target="_blank" rel="noopener">🎧 Suporte</a>
                <span class="version">v1.3</span>
            </footer>
        </div>
    </div>

    <script src="license.js"></script>
    <script src="popup.js"></script>
    <script src="history.js"></script>
    <script src="ui.js"></script>
</body>
</html>
