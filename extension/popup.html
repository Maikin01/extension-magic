<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovable Chat</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app-shell">
        <!-- Top bar -->
        <header class="topbar">
            <div class="brand">
                <img src="icons/throne-mascot.png" alt="" class="brand-logo" />
                <span class="brand-name">Lovable Chat</span>
            </div>
            <div class="topbar-right">
                <span class="version-tag">v1.0</span>
                <div class="lang-switch" role="tablist" aria-label="Idioma">
                    <button type="button" class="lang-pill active" data-lang="pt">PT</button>
                    <button type="button" class="lang-pill" data-lang="en">EN</button>
                    <button type="button" class="lang-pill" data-lang="es">ES</button>
                </div>
                <button type="button" class="icon-btn minimize-btn" title="Minimizar" aria-label="Minimizar">—</button>
                <button id="clearHistoryBtn" class="icon-btn clear-history-btn" title="Limpar histórico deste projeto" aria-label="Limpar histórico">🗑</button>
            </div>
        </header>

        <!-- Project info (mantido, oculto no gate) -->
        <div class="project-info-bar">
            <span id="projectId">Carregando...</span>
        </div>

        <!-- License Gate -->
        <section class="license-gate" id="licenseGate" style="display: none;">
            <div class="license-card">
                <div class="license-hero">
                    <img src="icons/throne-mascot.png" alt="" class="license-hero-img" />
                </div>

                <h2 class="license-title">Insira sua licença</h2>
                <p class="license-sub">Insira sua licença</p>

                <form id="licenseForm" class="license-form" autocomplete="off">
                    <input
                        id="licenseKeyInput"
                        type="text"
                        class="license-input"
                        placeholder="LVBL-XXXX-XXXX-XXXX"
                        spellcheck="false"
                        autocapitalize="characters"
                        maxlength="64"
                    />
                    <button type="submit" id="licenseSubmit" class="btn-primary">
                        Validar Licença
                    </button>
                </form>

                <a
                    href="https://vamos-extend-buddy.lovable.app/planos"
                    target="_blank"
                    rel="noopener"
                    class="btn-outline"
                >
                    <span class="cart-icon" aria-hidden="true">🛒</span>
                    Comprar Licença
                </a>

                <div id="licenseError" class="license-error" style="display:none;"></div>
                <div id="licenseStatus" class="license-status"></div>
            </div>
        </section>

        <!-- License info bar (mostra quando ativada) -->
        <div class="license-info-bar" id="licenseInfoBar" style="display:none;">
            <span class="license-info-dot"></span>
            <span id="licenseInfoText">Licença ativa</span>
            <button id="licenseLogout" class="license-logout" title="Sair da licença">Sair</button>
        </div>

        <!-- Chat original — NÃO modificar IDs/estrutura interna -->
        <div class="chat-shell" id="chatShell" style="display:none;">
            <div class="chat-container" id="chatContainer">
                <div class="messages" id="messages"></div>
            </div>

            <div class="file-preview" id="filePreview" style="display: none;"></div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="Digite sua mensagem..."
                        rows="3"
                    ></textarea>
                    <div class="button-group">
                        <button id="attachButton" class="attach-btn" title="Anexar arquivo">📎</button>
                        <input
                            type="file"
                            id="fileInput"
                            multiple
                            accept="image/*,.pdf,.doc,.docx,.txt,.js,.ts,.jsx,.tsx,.json,.css,.html"
                            style="display: none;"
                        />
                        <button id="sendButton" class="send-btn" title="Enviar mensagem">➤</button>
                    </div>
                </div>
            </div>

            <div class="status-bar" id="statusBar"></div>
        </div>
    </div>

    <script src="license.js"></script>
    <script src="popup.js"></script>
    <script src="history.js"></script>
</body>
</html>
