<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Lovable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app-shell">
        <!-- Top bar -->
        <header class="topbar">
            <div class="brand">
                <img src="icons/throne-mascot.png" alt="" class="brand-logo" />
                <span class="brand-name">Rise<br/>Lovable</span>
            </div>
            <div class="topbar-right">
                <span class="pro-badge">PRO</span>
                <div class="lang-pills" role="group" aria-label="Idioma">
                    <button type="button" class="lang-pill active" data-lang="pt">PT</button>
                    <button type="button" class="lang-pill" data-lang="en">EN</button>
                    <button type="button" class="lang-pill" data-lang="es">ES</button>
                </div>
                <button type="button" class="icon-btn" title="Notificações" aria-label="Notificações">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
                <button type="button" id="themeToggle" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">
                    <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button type="button" id="licenseLogoutTop" class="icon-btn" title="Sair" aria-label="Sair">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- Project info (kept, hidden) -->
        <div class="project-info-bar">
            <span id="projectId">Carregando...</span>
        </div>

        <!-- License Gate -->
        <section class="license-gate" id="licenseGate" style="display: none;">
            <div class="license-card">
                <div class="license-hero">
                    <img src="icons/throne-mascot.png" alt="" class="license-hero-img" />
                </div>
                <h2 class="license-title">Insira sua licença</h2>
                <p class="license-sub">Insira sua licença</p>

                <form id="licenseForm" class="license-form" autocomplete="off">
                    <input id="licenseKeyInput" type="text" class="license-input" placeholder="LVBL-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" maxlength="64" />
                    <button type="submit" id="licenseSubmit" class="btn-primary">Validar Licença</button>
                </form>

                <a href="https://vamos-extend-buddy.lovable.app/planos" target="_blank" rel="noopener" class="btn-outline">
                    <span class="cart-icon" aria-hidden="true">🛒</span>
                    Comprar Licença
                </a>

                <div id="licenseError" class="license-error" style="display:none;"></div>
                <div id="licenseStatus" class="license-status"></div>
            </div>
        </section>

        <!-- License info bar removed; logout handled by top icon button -->
        <div class="license-info-bar" id="licenseInfoBar" style="display:none;" hidden></div>

        <!-- Main chat shell -->
        <div class="chat-shell" id="chatShell" style="display:none;">
            <div class="chat-scroll">
                <!-- User status card -->
                <section class="user-card">
                    <div class="user-card-head">
                        <span class="user-name">User</span>
                        <span class="status-badge">ATIVO</span>
                    </div>
                    <div class="sync-row">
                        <span class="sync-check">✅</span>
                        <span class="sync-text">Sincronizado! Projeto: <span class="sync-project">2566d1...</span></span>
                    </div>
                    <div class="timer-box">
                        <div class="timer-head">
                            <span class="timer-label">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                Licença expira em
                            </span>
                            <span class="timer-value">58:15</span>
                        </div>
                        <div class="timer-bar"><div class="timer-bar-fill"></div></div>
                    </div>
                </section>

                <!-- Tabs -->
                <div class="tabs" role="tablist">
                    <button type="button" class="tab active" data-tab="prompt" role="tab">Prompt</button>
                    <button type="button" class="tab" data-tab="historico" role="tab">Histórico</button>
                </div>

                <!-- Tab: Prompt -->
                <div class="tab-panel" data-panel="prompt">
                    <div class="input-container">
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="Digite seu comando..." rows="4"></textarea>
                        </div>
                        <div class="prompt-toolbar">
                            <label class="toggle-plan">
                                <input type="checkbox" id="modoPlano" />
                                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                                <span class="toggle-label">MODO PLANO</span>
                            </label>
                            <div class="toolbar-actions">
                                <button id="attachButton" type="button" class="tool-btn" title="Anexar arquivo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                </button>
                                <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt,.js,.ts,.jsx,.tsx,.json,.css,.html" style="display: none;" />
                                <button type="button" class="tool-btn" title="Áudio">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                                </button>
                                <button id="sendButton" type="button" class="btn-send" title="Enviar mensagem">Enviar</button>
                            </div>
                        </div>
                        <div class="file-preview" id="filePreview" style="display: none;"></div>
                    </div>

                    <!-- Atalhos Rápidos -->
                    <div class="section-title">ATALHOS RÁPIDOS</div>
                    <div class="shortcut-grid">
                        <button type="button" class="shortcut-btn" data-shortcut="bugs"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l1.88 1.88"/><path d="M14.12 3.88L16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg></span> Bugs</button>
                        <button type="button" class="shortcut-btn" data-shortcut="refatorar"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></span> Refatorar</button>
                        <button type="button" class="shortcut-btn" data-shortcut="erros"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span> Erros</button>
                        <button type="button" class="shortcut-btn" data-shortcut="otimizar"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span> Otimizar</button>
                        <button type="button" class="shortcut-btn" data-shortcut="comentarios"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Comentários</button>
                        <button type="button" class="shortcut-btn" data-shortcut="seo"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span> SEO</button>
                        <button type="button" class="shortcut-btn" data-shortcut="ui"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="19" cy="13" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="10" cy="20" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20"/></svg></span> UI</button>
                        <button type="button" class="shortcut-btn" data-shortcut="componentes"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8.5L12 2l6.5 6.5L12 15z"/><path d="M12 15l6.5 6.5"/><path d="M5.5 15.5L12 22"/><path d="M2 12h4"/><path d="M18 12h4"/></svg></span> Componentes</button>
                        <button type="button" class="shortcut-btn" data-shortcut="review"><span class="s-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span> Review</button>
                    </div>

                    <!-- Ações especiais (ocultas por padrão) -->
                    <div class="action-stack" hidden></div>
                </div>

                <!-- Tab: Histórico -->
                <div class="tab-panel hidden" data-panel="historico">
                    <div class="messages" id="messages"></div>
                    <div class="history-empty">
                        <div class="empty-bubble">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
                        </div>
                        <div class="empty-title">Nenhuma mensagem</div>
                        <div class="empty-sub">Seus prompts enviados aparecerão aqui.</div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="app-footer">
                <a href="#" class="footer-link">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
                    Suporte
                </a>
                <span class="footer-version">v1.3</span>
            </footer>

            <div class="status-bar" id="statusBar"></div>
            <div id="chatContainer" style="display:none;"></div>
        </div>
    </div>

    <script src="vendor/jszip.min.js"></script>
    <script src="license.js"></script>
    <script src="popup.js"></script>
    <script src="history.js"></script>
    <script src="ui-extras.js"></script>
</body>
</html>
